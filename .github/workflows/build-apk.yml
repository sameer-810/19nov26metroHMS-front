name: Build Android APK

# Run manually from the Actions tab ("Run workflow" button).
# Each run uses one EAS build from your Expo plan, so it is not triggered on every push.
on:
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link Expo project (only needed if app.json has no projectId yet)
        run: eas init --non-interactive --force

      - name: Build APK on EAS (waits until finished)
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download APK
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "APK URL: $URL"
          echo "### APK ready: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          curl -L -o metro-hospital.apk "$URL"

      - name: Upload APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: metro-hospital-apk
          path: metro-hospital.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Metro Hospital APK (build ${{ github.run_number }})
          body: Android test build (preview profile). Download the .apk below and install it on the phone.
          prerelease: true
          files: metro-hospital.apk
