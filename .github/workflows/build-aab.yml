name: Build Android AAB (Play Store)

# Run manually from the Actions tab ("Run workflow" button).
# Uses the "production" profile in eas.json: builds an .aab for Google Play,
# and auto-increments the Android versionCode on every build.
on:
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link Expo project (only needed if app.json has no projectId yet)
        run: eas init --non-interactive --force

      - name: Build AAB on EAS (waits until finished)
        run: eas build --platform android --profile production --non-interactive --wait --json > build.json

      - name: Download AAB
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "AAB URL: $URL"
          echo "### AAB ready: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          curl -L -o Metro-Hospital.aab "$URL"

      - name: Upload AAB to this run
        uses: actions/upload-artifact@v4
        with:
          name: Metro-Hospital-AAB
          path: Metro-Hospital.aab

      - name: Publish AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-${{ github.run_number }}
          name: Metro Hospital AAB (build ${{ github.run_number }})
          body: Play Store build (production profile). Upload this .aab in Google Play Console; it cannot be installed on a phone directly.
          files: Metro-Hospital.aab
